<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Photo Journal</title>
<meta name="theme-color" content="#faf6f0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Journal"><meta name="apple-mobile-web-app-status-bar-style" content="default">  <link rel="stylesheet" href="styles.css">
</head><body>
<section id="loginV" hidden><form class="login" id="loginF"><h1 style="text-align:center">Photo Journal</h1>
<input id="em" type="email" placeholder="Email" autocomplete="username" required>
<input id="pw" type="password" placeholder="Password" autocomplete="current-password" required>
<button class="primary" type="submit">Sign in</button><button type="button" id="magic">Email me a sign-in link</button><div class="msg" id="lmsg"></div></form></section>
<section id="appV" hidden>
<main>
<section class="profile">
 <div class="ptop"><h1 class="ptitle" id="pTitle">PHOTO JOURNAL</h1><button type="button" class="icon" id="menuBtn" aria-label="Menu" aria-haspopup="true">⋯</button></div>
 <p class="bio" id="pBio"></p>
 <p class="count" id="count"></p><p class="msg" id="pHint" hidden></p>
</section>
<nav class="tabs" role="tablist"><button type="button" role="tab" class="tab on" id="tabAll" aria-selected="true"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg><span>All</span></button><button type="button" role="tab" class="tab" id="tabCol" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Collections</span></button></nav>
<div id="allV"><div id="grid" class="grid"></div></div>
<div id="colV" hidden>
 <h3 class="sec">By month</h3><div class="folders" id="monthF"></div>
 <h3 class="sec">Categories</h3><p class="msg" id="catHint" hidden>Categories need a quick database update — run migrate-categories.sql in Supabase.</p><div class="folders" id="catF"></div>
</div>
<div id="folderV" hidden><div class="fhead"><button type="button" class="icon" id="fBack" aria-label="Back to collections">‹</button><h3 id="fName"></h3><button type="button" class="icon" id="fMenu" aria-label="Category options">⋯</button></div>
 <p class="count" id="fCount"></p><div id="fgrid" class="grid"></div></div>
</main>
<button type="button" class="fab" id="add" aria-label="New post">+</button>
</section>
<section id="feedV" class="feedV" hidden aria-label="Posts">
 <div class="fbar"><button type="button" class="icon" id="back" aria-label="Back to grid">‹</button><span class="ftitle" id="fTitle">Posts</span></div>
 <div class="feed" id="feed"></div>
</section>
<dialog id="catD" class="sheet"><div class="sheetb">
 <button type="button" id="cRen">Rename category</button><button type="button" id="cDel" class="danger">Delete category</button><button type="button" id="cClose">Cancel</button></div></dialog>
<dialog id="menuD" class="sheet"><div class="sheetb">
 <button type="button" id="mProfile">Edit profile</button><button type="button" id="exp">Export backup</button>
 <button type="button" id="out" class="danger">Sign out</button><button type="button" id="mClose">Cancel</button></div></dialog>
<dialog id="postD" class="sheet"><div class="sheetb">
 <button type="button" id="pmEdit">Edit post</button><button type="button" id="pmDel" class="danger">Delete post</button><button type="button" id="pmClose">Cancel</button></div></dialog>
<dialog id="newD"><form class="form" id="newF"><h2>New post</h2>
<div class="drop" id="drop">Click or drop up to 8 photos here</div><input id="file" type="file" accept="image/*" multiple hidden>
<div class="thumbs" id="thumbs"></div><div class="msg" id="nmsg"></div>
<textarea id="newCap" placeholder="Write a caption…"></textarea>
<div class="when"><label>Date<input type="date" id="newDate" required></label><label>Time <span class="opt">(optional)</span><input type="time" id="newTime"></label></div>
<div class="catpick" id="newCats"></div>
<div class="row"><button type="button" id="newCancel">Cancel</button><button class="primary" id="save" type="submit" disabled>Post</button></div></form></dialog>
<dialog id="editD"><form class="form" id="editF"><h2>Edit post</h2>
<textarea id="eCap" placeholder="Caption"></textarea>
<div class="when"><label>Date<input type="date" id="eDate" required></label><label>Time <span class="opt">(optional)</span><input type="time" id="eTime"></label></div>
<div class="catpick" id="eCats"></div>
<div class="row"><button type="button" id="eCancel">Cancel</button><button class="primary" type="submit" id="eSave">Save</button></div></form></dialog>
<dialog id="profD"><form class="form" id="profF"><h2>Edit profile</h2>
<label class="fl">Title<input type="text" id="prTitle" maxlength="60" placeholder="PHOTO JOURNAL"></label>
<label class="fl">Bio<textarea id="prBio" maxlength="500" placeholder="A few words about this journal…"></textarea></label>
<div class="msg" id="prMsg"></div>
<div class="row"><button type="button" id="prCancel">Cancel</button><button class="primary" type="submit" id="prSave">Save</button></div></form></dialog>
<script src="config.js"></script><script src="supabase.js"></script>
<script>
"use strict";
const $=id=>document.getElementById(id);
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
const configured=!/YOUR-/.test(window.SUPABASE_URL+window.SUPABASE_ANON_KEY);
const sb=configured?supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,detectSessionInUrl:true}}):null;
const MAX=8,DEF_TITLE="PHOTO JOURNAL";
let user=null,posts=[],cur=null,pending=[],profile={title:DEF_TITLE,bio:""},profileOK=true,catsOK=true,tab="all",folder=null,feedFilter=null;
const catsOf=p=>Array.isArray(p.categories)?p.categories:[];
const normCat=s=>s.replace(/\s+/g," ").trim().slice(0,40);
const same=(a,b)=>a.toLowerCase()===b.toLowerCase();
const pathsOf=p=>(Array.isArray(p.image_paths)&&p.image_paths.length)?p.image_paths:(p.image_path?[p.image_path]:[]);
const fmt=t=>{const d=new Date(t);return d.toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"})+(hasTime(t)?" · "+d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}):"")};
const pad=n=>String(n).padStart(2,"0");
const toDate=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()),toTime=d=>pad(d.getHours())+":"+pad(d.getMinutes());
// no time given -> stored as 12:00:01 local (noon avoids timezone date shifts; :01 marks "no time" so it isn't displayed)
const fromInputs=(d,t)=>{const[y,m,da]=d.split("-").map(Number);if(!t)return new Date(y,m-1,da,12,0,1).toISOString();const[h,mi]=t.split(":").map(Number);return new Date(y,m-1,da,h,mi,0).toISOString()};
const hasTime=t=>{const d=new Date(t);return !(d.getHours()===12&&d.getMinutes()===0&&d.getSeconds()===1)};
function view(signedIn){$("loginV").hidden=signedIn;$("appV").hidden=!signedIn;if(!signedIn)closeFeed(true)}
async function onSession(s){user=s&&s.user;view(!!user);if(user){loadProfile();load()}}
if(!sb){view(false);$("lmsg").textContent="Not configured yet: add your Supabase URL and anon key to config.js.";$("loginF").querySelectorAll("button,input").forEach(e=>e.disabled=true)}
else{sb.auth.getSession().then(({data})=>onSession(data.session));sb.auth.onAuthStateChange((_e,s)=>{if(!!(s&&s.user)!==!!user)onSession(s)})}
$("loginF").onsubmit=async e=>{e.preventDefault();$("lmsg").textContent="Signing in…";const{error}=await sb.auth.signInWithPassword({email:$("em").value,password:$("pw").value});$("lmsg").textContent=error?error.message:""};
$("magic").onclick=async()=>{if(!$("em").value)return $("lmsg").textContent="Enter your email first.";const{error}=await sb.auth.signInWithOtp({email:$("em").value,options:{shouldCreateUser:false,emailRedirectTo:location.href.split("#")[0]}});$("lmsg").textContent=error?error.message:"Check your email for the link."};

/* ---------- menu ---------- */
$("menuBtn").onclick=()=>$("menuD").showModal();$("mClose").onclick=()=>$("menuD").close();
document.querySelectorAll("dialog.sheet").forEach(d=>d.addEventListener("click",e=>{if(e.target===d)d.close()}));
$("out").onclick=async()=>{$("menuD").close();await sb.auth.signOut();user=null;posts=[];$("grid").innerHTML="";setTab("all");view(false)};

/* ---------- profile ---------- */
function drawProfile(){$("pTitle").textContent=(profile.title||DEF_TITLE).toUpperCase();$("pBio").textContent=profile.bio||"";$("pBio").hidden=!profile.bio;
 $("pHint").hidden=profileOK;$("pHint").textContent=profileOK?"":"Profile isn't syncing yet — run migrate-profile.sql in Supabase."}
async function loadProfile(){drawProfile();const{data,error}=await sb.from("profiles").select("title,bio").eq("user_id",user.id).maybeSingle();
 if(error){profileOK=false;console.warn("profiles:",error.message)}else{profileOK=true;if(data)profile={title:data.title||DEF_TITLE,bio:data.bio||""}}drawProfile()}
$("mProfile").onclick=()=>{$("menuD").close();$("prTitle").value=profile.title||DEF_TITLE;$("prBio").value=profile.bio||"";$("prMsg").textContent=profileOK?"":"Profile table missing: changes will only show until you reload. Run migrate-profile.sql.";$("profD").showModal()};
$("pTitle").onclick=$("mProfile").onclick;
$("prCancel").onclick=()=>$("profD").close();
$("profF").onsubmit=async e=>{e.preventDefault();const p={title:($("prTitle").value.trim()||DEF_TITLE).toUpperCase(),bio:$("prBio").value.trim()};
 $("prSave").disabled=true;const{error}=await sb.from("profiles").upsert({user_id:user.id,...p,updated_at:new Date().toISOString()},{onConflict:"user_id"});$("prSave").disabled=false;
 profile=p;if(error){profileOK=false;$("prMsg").textContent="Couldn't sync ("+error.message+"). Run migrate-profile.sql.";drawProfile();return}
 profileOK=true;drawProfile();$("profD").close()};

/* ---------- posts ---------- */
async function load(){$("count").textContent="Loading…";
 const{data,error}=await sb.from("posts").select("*").order("created_at",{ascending:false});
 if(error){$("count").textContent="Error: "+error.message;return}
 {const pr=await sb.from("posts").select("categories").limit(1);catsOK=!pr.error;if(pr.error)console.warn("categories:",pr.error.message)}
 posts=data;const all=posts.flatMap(pathsOf);if(all.length){const{data:s}=await sb.storage.from("photos").createSignedUrls(all,3600);const m={};(s||[]).forEach(x=>m[x.path]=x.signedUrl);posts.forEach(p=>{p.urls=pathsOf(p).map(k=>m[k]||"");p.url=p.urls[0]})}
 render()}
function sortPosts(){posts.sort((a,b)=>Date.parse(b.created_at)-Date.parse(a.created_at))}
function tiles(g,list,filter){g.innerHTML="";
 if(!list.length){g.style.display="block";g.innerHTML='<div class="empty">'+(filter?'No posts here yet.':'Your journal is empty.<br>Tap <b>+</b> to add your first photo.')+'</div>';return}
 g.style.display="";list.forEach(p=>{const b=document.createElement("button"),i=document.createElement("img");i.src=p.url||"";i.alt=p.caption||"Photo";i.loading="lazy";b.appendChild(i);if(p.urls&&p.urls.length>1){b.insertAdjacentHTML("beforeend",'<span class="multi" aria-label="'+p.urls.length+' photos"><svg viewBox="0 0 24 24"><rect x="7" y="7" width="13" height="13" rx="2"/><path d="M4 16V6a2 2 0 0 1 2-2h10"/></svg></span>')}b.onclick=()=>openFeed(p.id,filter);g.appendChild(b)})}
const monthKey=p=>{const d=new Date(p.created_at);return d.getFullYear()+"-"+pad(d.getMonth()+1)};
const monthName=k=>{const[y,m]=k.split("-").map(Number);return new Date(y,m-1,1).toLocaleDateString(undefined,{month:"long",year:"numeric"})};
function filterFn(f){if(!f)return()=>true;return f.type==="month"?p=>monthKey(p)===f.key:p=>catsOf(p).some(c=>same(c,f.name))}
function allCats(){const m=new Map();const add=c=>{const k=c.toLowerCase();if(!m.has(k))m.set(k,c)};posts.forEach(p=>catsOf(p).forEach(add));extraCats().forEach(add);return[...m.values()].sort((a,b)=>a.localeCompare(b))}
// categories with no posts yet live only on this device until a post uses them
const extraCats=()=>{try{return JSON.parse(localStorage.getItem("pj-cats")||"[]")}catch{return[]}};
const setExtra=l=>localStorage.setItem("pj-cats",JSON.stringify(l));
function addExtra(c){const l=extraCats();if(!l.some(x=>same(x,c)))l.push(c);setExtra(l)}
function card(name,list,onclick,cls){const b=document.createElement("button");b.type="button";b.className="fcard"+(cls?" "+cls:"");
 b.innerHTML='<div class="fcov"></div><div class="fn"></div><div class="fc"></div>';b.querySelector(".fn").textContent=name;
 if(list){b.querySelector(".fc").textContent=list.length+(list.length===1?" post":" posts");if(list[0]&&list[0].url){const i=new Image();i.src=list[0].url;i.alt="";i.loading="lazy";b.querySelector(".fcov").appendChild(i)}}
 b.onclick=onclick;return b}
function renderCollections(){const mf=$("monthF"),cf=$("catF");mf.innerHTML="";cf.innerHTML="";
 const months=[...new Set(posts.map(monthKey))];
 months.forEach(k=>{const f={type:"month",key:k,name:monthName(k)};mf.appendChild(card(f.name,posts.filter(filterFn(f)),()=>openFolder(f)))});
 if(!months.length)mf.innerHTML='<p class="msg">Months appear here once you post.</p>';
 $("catHint").hidden=catsOK;if(!catsOK)return;
 allCats().forEach(c=>{const f={type:"cat",name:c};cf.appendChild(card(c,posts.filter(filterFn(f)),()=>openFolder(f)))});
 const n=card("New category",null,()=>{const v=prompt("Name your category (e.g. a person, place, or trip):");if(!v||!normCat(v))return;const c=normCat(v);if(!allCats().some(x=>same(x,c)))addExtra(c);renderCollections()},"fnew");
 n.querySelector(".fcov").textContent="+";n.querySelector(".fc").textContent="People, places, trips…";cf.appendChild(n)}
function setTab(t){tab=t;folder=null;$("tabAll").classList.toggle("on",t==="all");$("tabCol").classList.toggle("on",t==="col");$("tabAll").setAttribute("aria-selected",t==="all");$("tabCol").setAttribute("aria-selected",t==="col");showSection()}
function showSection(){$("allV").hidden=!(tab==="all");$("colV").hidden=!(tab==="col"&&!folder);$("folderV").hidden=!folder}
$("tabAll").onclick=()=>setTab("all");$("tabCol").onclick=()=>setTab("col");
let colY=0;
function openFolder(f){colY=scrollY;folder=f;renderFolder();showSection();$("folderV").scrollIntoView({block:"start"})}
function renderFolder(){if(!folder)return;if(folder.type==="cat"){const real=allCats().find(c=>same(c,folder.name));if(!real){folder=null;showSection();return}folder.name=real}
 const list=posts.filter(filterFn(folder));$("fName").textContent=folder.type==="month"?monthName(folder.key):folder.name;$("fCount").textContent=list.length+(list.length===1?" post":" posts");
 $("fMenu").hidden=folder.type!=="cat";tiles($("fgrid"),list,folder)}
$("fBack").onclick=()=>{folder=null;showSection();scrollTo(0,colY)};
function render(){sortPosts();$("count").textContent=posts.length+(posts.length===1?" moment":" moments");
 tiles($("grid"),posts,null);renderCollections();renderFolder();showSection();
 if(!$("feedV").hidden){const l=feedList();if(!l.length)closeFeed();else buildFeed()}}
/* category picker */
function catPicker(el,sel){el.innerHTML="";el.hidden=!catsOK;if(!catsOK)return;
 el.innerHTML='<div class="cplabel">Categories</div><div class="chips"></div><div class="cpadd"><input type="text" maxlength="40" placeholder="Add a category…" enterkeyhint="done"><button type="button">Add</button></div>';
 const chips=el.querySelector(".chips"),inp=el.querySelector("input");
 const draw=()=>{chips.innerHTML="";const names=allCats();sel.forEach(s=>{if(!names.some(n=>same(n,s)))names.push(s)});
  if(!names.length)chips.innerHTML='<span class="msg">No categories yet — type one below.</span>';
  names.forEach(n=>{const b=document.createElement("button");b.type="button";b.className="chip"+(sel.some(s=>same(s,n))?" on":"");b.textContent=n;b.setAttribute("aria-pressed",b.classList.contains("on"));
   b.onclick=()=>{const i=sel.findIndex(s=>same(s,n));if(i>=0)sel.splice(i,1);else sel.push(n);draw()};chips.appendChild(b)})};
 const add=()=>{const c=normCat(inp.value);inp.value="";if(!c)return;const ex=allCats().find(x=>same(x,c))||sel.find(x=>same(x,c))||c;if(!sel.some(s=>same(s,ex)))sel.push(ex);draw()};
 el.querySelector(".cpadd button").onclick=add;inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();add()}});draw()}
let newSel=[],editSel=[];
/* rename / delete category */
$("fMenu").onclick=()=>$("catD").showModal();$("cClose").onclick=()=>$("catD").close();
async function rewriteCat(fn){const old=folder.name,hit=posts.filter(p=>catsOf(p).some(c=>same(c,old)));
 for(const p of hit){const next=[];fn(catsOf(p)).forEach(c=>{if(!next.some(x=>same(x,c)))next.push(c)});const{error}=await sb.from("posts").update({categories:next}).eq("id",p.id);if(error){alert(error.message);break}p.categories=next}}
$("cRen").onclick=async()=>{$("catD").close();const old=folder.name;const v=prompt("Rename category",old);const c=v&&normCat(v);if(!c||c===old)return;
 await rewriteCat(l=>l.map(x=>same(x,old)?c:x));setExtra(extraCats().filter(x=>!same(x,old)));if(!posts.some(p=>catsOf(p).some(x=>same(x,c))))addExtra(c);folder={type:"cat",name:c};render()};
$("cDel").onclick=async()=>{$("catD").close();const old=folder.name;if(!confirm('Delete the category "'+old+'"? Your posts stay; they just lose this label.'))return;
 await rewriteCat(l=>l.filter(x=>!same(x,old)));setExtra(extraCats().filter(x=>!same(x,old)));folder=null;render()};

/* ---------- carousel (reusable) ---------- */
function carousel(urls,alt){const u=urls&&urls.length?urls:[""];const c=document.createElement("div");c.className="car";
 c.innerHTML='<div class="track"></div><button type="button" class="nav prev" aria-label="Previous">‹</button><button type="button" class="nav next" aria-label="Next">›</button><div class="counter"></div><div class="dots"></div>';
 const tr=c.querySelector(".track"),dots=c.querySelector(".dots"),ctr=c.querySelector(".counter"),pv=c.querySelector(".prev"),nx=c.querySelector(".next");
 u.forEach((src,i)=>{const s=document.createElement("div");s.className="slide";const im=document.createElement("img");im.src=src;im.loading="lazy";im.alt=(alt||"Photo")+" "+(i+1)+"/"+u.length;s.appendChild(im);tr.appendChild(s);dots.appendChild(document.createElement("span"))});
 const multi=u.length>1;pv.hidden=nx.hidden=ctr.hidden=dots.hidden=!multi;
 const idx=()=>tr.clientWidth?Math.round(tr.scrollLeft/tr.clientWidth):0;
 const upd=()=>{const i=Math.min(idx(),u.length-1);ctr.textContent=(i+1)+"/"+u.length;[...dots.children].forEach((d,k)=>d.classList.toggle("on",k===i));pv.disabled=i<=0;nx.disabled=i>=u.length-1};
 const go=d=>tr.scrollTo({left:(idx()+d)*tr.clientWidth,behavior:"smooth"});
 tr.addEventListener("scroll",()=>requestAnimationFrame(upd),{passive:true});pv.onclick=()=>go(-1);nx.onclick=()=>go(1);
 c.tabIndex=-1;c.addEventListener("keydown",e=>{if(e.key==="ArrowLeft")go(-1);if(e.key==="ArrowRight")go(1)});c.go=go;upd();return c}

/* ---------- feed ---------- */
let gridY=0,feedPushed=false,ignorePop=0;
const feedList=()=>posts.filter(filterFn(feedFilter));
function buildFeed(){const f=$("feed");f.innerHTML="";$("fTitle").textContent=feedFilter?(feedFilter.type==="month"?monthName(feedFilter.key):feedFilter.name):"Posts";for(const p of feedList()){const a=document.createElement("article");a.className="post";a.dataset.id=p.id;
 a.innerHTML='<div class="phead"><time></time><button type="button" class="icon pm" aria-label="Post options">⋯</button></div><p class="pcap"></p>';
 a.querySelector("time").textContent=fmt(p.created_at);a.querySelector("time").dateTime=p.created_at;
 a.querySelector(".phead").after(carousel(p.urls||[p.url],p.caption));const c=a.querySelector(".pcap");c.textContent=p.caption||"";c.hidden=!p.caption;
 a.querySelector(".pm").onclick=()=>{cur=p;$("postD").showModal()};f.appendChild(a)}}
function openFeed(id,filter){gridY=scrollY;feedFilter=filter?{...filter}:null;buildFeed();$("feedV").hidden=false;document.body.classList.add("lock");
 const el=$("feed").querySelector('[data-id="'+CSS.escape(id)+'"]');$("feedV").scrollTop=el?el.offsetTop-$("feedV").querySelector(".fbar").offsetHeight:0;
 if(!feedPushed){history.pushState({feed:true},"");feedPushed=true}}
function closeFeed(silent){if($("feedV").hidden)return;$("feedV").hidden=true;document.body.classList.remove("lock");scrollTo(0,gridY);if(!silent&&feedPushed){feedPushed=false;ignorePop++;history.back()}}
$("back").onclick=()=>closeFeed();addEventListener("popstate",()=>{if(ignorePop){ignorePop--;return}feedPushed=false;closeFeed(true)});
addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("feedV").hidden&&!document.querySelector("dialog[open]"))closeFeed();
 if((e.key==="ArrowLeft"||e.key==="ArrowRight")&&!$("feedV").hidden&&!document.querySelector("dialog[open]")){const ps=[...$("feed").children],top=$("feedV").scrollTop+80;const a=ps.find(x=>x.offsetTop+x.offsetHeight>top);a&&a.querySelector(".car").go(e.key==="ArrowLeft"?-1:1)}});

/* ---------- new post ---------- */
function resize(file){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{URL.revokeObjectURL(u);const M=1600,s=Math.min(1,M/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);c.toBlob(b=>b?res(b):rej(new Error("encode failed")),"image/jpeg",.85)};img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("Could not read this image (HEIC? try JPEG/PNG)."))};img.src=u})}
async function pick(files){const list=[...files].filter(f=>f.type.startsWith("image/")||/\.hei[cf]$/i.test(f.name));
 if(!list.length)return note("Please choose image files.");const room=MAX-pending.length;
 if(room<=0)return note("A post can have at most 8 photos.");
 const take=list.slice(0,room);note(list.length>room?"Only 8 photos per post — added the first "+room+".":"Processing…");
 for(const f of take){try{const blob=await resize(f);pending.push({blob,url:URL.createObjectURL(blob)})}catch(e){note(e.message)}}
 if($("nmsg").textContent==="Processing…")note("");drawThumbs()}
function note(t){$("nmsg").textContent=t}
function drawThumbs(){const t=$("thumbs");t.innerHTML="";pending.forEach((p,i)=>{const d=document.createElement("div");d.className="thumb";d.draggable=true;
 d.innerHTML='<img alt=""><span class="n">'+(i+1)+'</span><button type="button" class="rm" aria-label="Remove">×</button><div class="mv"><button type="button" aria-label="Move left">‹</button><button type="button" aria-label="Move right">›</button></div>';
 d.querySelector("img").src=p.url;d.querySelector(".rm").onclick=()=>{URL.revokeObjectURL(p.url);pending.splice(i,1);note("");drawThumbs()};
 const[l,r]=d.querySelectorAll(".mv button");l.disabled=i===0;r.disabled=i===pending.length-1;l.onclick=()=>move(i,i-1);r.onclick=()=>move(i,i+1);
 d.ondragstart=e=>{e.dataTransfer.setData("text/x-idx",i);e.stopPropagation()};d.ondragover=e=>e.preventDefault();
 d.ondrop=e=>{const f=e.dataTransfer.getData("text/x-idx");if(f!==""){e.preventDefault();e.stopPropagation();move(+f,i)}};t.appendChild(d)});
 $("drop").textContent=pending.length?(pending.length+"/8 photos — tap or drop to add more"):"Click or drop up to 8 photos here";$("drop").classList.toggle("full",pending.length>=MAX);
 $("save").disabled=!pending.length}
function move(a,b){if(b<0||b>=pending.length)return;const[x]=pending.splice(a,1);pending.splice(b,0,x);drawThumbs()}
$("add").onclick=()=>{pending.forEach(p=>URL.revokeObjectURL(p.url));pending=[];$("newCap").value="";const n=new Date();$("newDate").value=toDate(n);$("newDate").max=toDate(n);$("newTime").value=toTime(n);newSel=folder&&folder.type==="cat"?[folder.name]:[];catPicker($("newCats"),newSel);note("");drawThumbs();$("save").textContent="Post";$("newD").showModal()};
$("newCancel").onclick=()=>$("newD").close();
$("drop").onclick=()=>{if(pending.length>=MAX)return note("A post can have at most 8 photos.");$("file").click()};$("file").onchange=e=>{pick(e.target.files);e.target.value=""};
const dz=$("drop");["dragenter","dragover"].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add("on")}));
["dragleave","drop"].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove("on")}));dz.addEventListener("drop",e=>pick(e.dataTransfer.files));
$("newF").onsubmit=async e=>{e.preventDefault();if(!pending.length)return;if(pending.length>MAX)return note("A post can have at most 8 photos.");if(!$("newDate").value)return note("Pick a date.");
 $("save").disabled=true;const done=[];let error=null;
 for(let i=0;i<pending.length;i++){$("save").textContent="Uploading "+(i+1)+"/"+pending.length+"…";const path=user.id+"/"+crypto.randomUUID()+".jpg";
  ({error}=await sb.storage.from("photos").upload(path,pending[i].blob,{contentType:"image/jpeg"}));if(error)break;done.push(path)}
 if(!error)({error}=await sb.from("posts").insert({caption:$("newCap").value.trim(),image_path:done[0],image_paths:done,created_at:fromInputs($("newDate").value,$("newTime").value),...(catsOK?{categories:[...newSel]}:{})}));
 if(error){if(done.length)await sb.storage.from("photos").remove(done);
  alert("Upload failed: "+error.message+(/image_paths/.test(error.message)?"\n\nRun migrate-multi.sql in the Supabase SQL editor first.":""));$("save").disabled=false;$("save").textContent="Post";return}
 pending.forEach(p=>URL.revokeObjectURL(p.url));pending=[];$("newD").close();setExtra(extraCats().filter(x=>!newSel.some(y=>same(x,y))));load()};

/* ---------- edit / delete ---------- */
$("pmClose").onclick=()=>$("postD").close();
$("pmEdit").onclick=()=>{$("postD").close();const d=new Date(cur.created_at);$("eCap").value=cur.caption||"";$("eDate").value=toDate(d);$("eTime").value=hasTime(cur.created_at)?toTime(d):"";editSel=[...catsOf(cur)];catPicker($("eCats"),editSel);$("editD").showModal()};
$("eCancel").onclick=()=>$("editD").close();
$("editF").onsubmit=async e=>{e.preventDefault();const c=$("eCap").value.trim(),t=fromInputs($("eDate").value,$("eTime").value);$("eSave").disabled=true;
 const{error}=await sb.from("posts").update({caption:c,created_at:t,...(catsOK?{categories:[...editSel]}:{})}).eq("id",cur.id);$("eSave").disabled=false;if(error)return alert(error.message);
 cur.caption=c;cur.created_at=t;if(catsOK){cur.categories=[...editSel];setExtra(extraCats().filter(x=>!posts.some(p=>catsOf(p).some(y=>same(x,y)))))}$("editD").close();const y=$("feedV").scrollTop;render();if(!$("feedV").hidden){const el=$("feed").querySelector('[data-id="'+CSS.escape(cur.id)+'"]');$("feedV").scrollTop=el?el.offsetTop-$("feedV").querySelector(".fbar").offsetHeight:y}};
$("pmDel").onclick=async()=>{$("postD").close();if(!confirm("Delete this post permanently?"))return;const{error}=await sb.from("posts").delete().eq("id",cur.id);if(error)return alert(error.message);
 await sb.storage.from("photos").remove([...new Set([...pathsOf(cur),cur.image_path].filter(Boolean))]);posts=posts.filter(p=>p.id!==cur.id);const y=$("feedV").scrollTop;render();$("feedV").scrollTop=y;if(!posts.length)closeFeed()};

/* ---------- export ---------- */
const b64=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
$("exp").onclick=async()=>{$("menuD").close();if(!posts.length)return alert("Nothing to export yet.");$("exp").disabled=true;const out=[];
 try{for(const p of posts){const images=[];for(const k of pathsOf(p)){const{data,error}=await sb.storage.from("photos").download(k);if(error)throw error;images.push(await b64(data))}out.push({id:p.id,date:Date.parse(p.created_at),caption:p.caption,categories:catsOf(p),image:images[0],images})}
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({app:"photo-journal",version:3,exported:Date.now(),profile,posts:out})],{type:"application/json"}));a.download="photo-journal-"+new Date().toISOString().slice(0,10)+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
 catch(e){alert("Export failed: "+e.message)}finally{$("exp").disabled=false}};
</script></body></html>
